[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  command = "npm run start"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200

[[redirects]]
  from = "/api/admin/crud"
  to = "/.netlify/functions/admin-crud"
  status = 200

[[redirects]]
  from = "/api/agent/chat"
  to = "/.netlify/functions/agent-chat"
  status = 200

[[redirects]]
  from = "/api/admin/llm/config"
  to = "/.netlify/functions/admin-agent?action=config"
  status = 200

[[redirects]]
  from = "/api/admin/llm/test"
  to = "/.netlify/functions/admin-agent?action=test"
  status = 200

[[redirects]]
  from = "/api/admin/conversations"
  to = "/.netlify/functions/admin-agent?action=conversations"
  status = 200
